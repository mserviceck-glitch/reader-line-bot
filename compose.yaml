name: line-document-bot
services:
  bot:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "app.py"]
    env_file: .env
    volumes:
      - ./app.py:/app/app.py:ro
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      BOT_DOMAIN: ${BOT_DOMAIN:?Set BOT_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
